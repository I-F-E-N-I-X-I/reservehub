services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservehub
      POSTGRES_USER: reservehub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservehub -d reservehub"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservehub
      DB_USER: reservehub
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:

name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reservehub_test
          POSTGRES_USER: reservehub
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reservehub -d reservehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - name: Repeat integration suite against PostgreSQL
        run: ./mvnw -B test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/reservehub_test
          TEST_DB_USER: reservehub
          TEST_DB_PASSWORD: test-only-password

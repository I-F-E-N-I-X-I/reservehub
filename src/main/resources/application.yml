spring:
  application:
    name: reservehub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservehub}
    username: ${DB_USER:reservehub}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
